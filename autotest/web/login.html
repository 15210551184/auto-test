<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - 自动化数据验证控制台</title>
<style>
:root{
  --ink:#12161c; --ink-2:#5a6472; --ink-3:#8f99a8;
  --line:#dde2e9; --bg:#eef1f5; --panel:#fff;
  --busy:#2f6fed; --fail:#d64550; --r:6px;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;align-items:center;justify-content:center}
.card{width:320px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:26px 24px;box-shadow:0 8px 24px rgba(18,22,28,.06)}
h1{font-size:15px;font-weight:600;margin:0 0 20px}
label{display:block;font-size:12px;color:var(--ink-2);margin:0 0 5px}
input[type=text],input[type=password]{width:100%;padding:8px 10px;border:1px solid var(--line);
  border-radius:5px;font-size:13px;background:#fff;color:var(--ink);font-family:inherit}
input:focus{outline:2px solid #b9cdf6;outline-offset:-1px;border-color:var(--busy)}
.row{margin-bottom:14px}
button{width:100%;font:500 13px/1 inherit;padding:10px 14px;border-radius:5px;cursor:pointer;
  border:1px solid var(--busy);background:var(--busy);color:#fff}
button:hover{background:#2a63d6}
.err{font-size:12px;color:var(--fail);margin-bottom:14px}
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>自动化数据验证控制台</h1>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="row">
      <label>账号</label>
      <input type="text" name="username" autofocus required>
    </div>
    <div class="row">
      <label>密码</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit">登录</button>
  </form>
</body>
</html>
